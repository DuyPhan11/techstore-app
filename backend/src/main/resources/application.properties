# Default active profile
spring.profiles.active=dev

# Application Info
spring.application.name=techstore-backend

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Jackson Configuration
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.serialization.write-dates-as-timestamps=false

# File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

jwt.secret=${JWT_SECRET:techstore-super-secret-jwt-signing-key-2026-minimum-256-bits-secure-token}
app.frontend-url=${FRONTEND_URL:http://localhost:5500}
app.mail-from=${MAIL_FROM:TechStore <techstore.official.vn@gmail.com>}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Resend HTTPS Email API (Port 443 - works on Render Free)
resend.api-key=${RESEND_API_KEY:}

# Google Gemini AI Configuration
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-3.5-flash-lite

# Cloudinary Storage Configuration (Auto-upload to Cloudinary on Render / Production)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
