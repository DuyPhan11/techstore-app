<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khôi Phục Mật Khẩu - TechStore</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/components.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <div class="text-center mb-4">
                    <a href="../../index.html" class="navbar-brand justify-content-center fs-3">
                        <i class="bi bi-cpu-fill"></i>
                        <span>TECHSTORE</span>
                    </a>
                    <h5 class="fw-bold mt-3">Quên Mật Khẩu?</h5>
                    <p class="text-muted small">Nhập email đăng ký để nhận liên kết đặt lại mật khẩu, có hiệu lực trong 15 phút.</p>
                </div>

                <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                    
                    <div id="alert-container"></div>

                    <!-- Step 1: Request Reset Token -->
                    <form id="forgot-form">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email tài khoản</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" placeholder="example@domain.com" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="btn-request-token">
                            <span class="spinner-border spinner-border-sm me-2 d-none" id="forgot-spinner"></span>
                            Gửi Liên Kết Qua Email
                        </button>
                    </form>

                    <!-- Step 2: Enter Token and New Password (hidden initially) -->
                    <form id="reset-form" class="d-none mt-3">
                        <hr class="my-3">
                        <h6 class="fw-bold text-success mb-3"><i class="bi bi-shield-check me-1"></i> Đặt lại mật khẩu mới</h6>

                        <input type="hidden" id="token" required>

                        <div class="mb-3">
                            <label for="newPassword" class="form-label fw-semibold">Mật khẩu mới</label>
                            <input type="password" class="form-control" id="newPassword" placeholder="Tối thiểu 6 ký tự" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold" id="btn-reset-password">
                            <span class="spinner-border spinner-border-sm me-2 d-none" id="reset-spinner"></span>
                            Xác Nhận Đổi Mật Khẩu
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top">
                        <a href="./login.html" class="fw-semibold text-primary text-decoration-none">
                            <i class="bi bi-arrow-left me-1"></i> Quay lại Đăng nhập
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./forgot-password.js"></script>
</body>
</html>
