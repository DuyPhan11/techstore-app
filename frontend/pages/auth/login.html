<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - TechStore</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/components.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <div class="text-center mb-4">
                    <a href="../../index.html" class="navbar-brand justify-content-center fs-3">
                        <i class="bi bi-cpu-fill"></i>
                        <span>TECHSTORE</span>
                    </a>
                    <p class="text-muted mt-2">Đăng nhập tài khoản để mua sắm và quản lý đơn hàng</p>
                </div>

                <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                    
                    <div id="alert-container"></div>

                    <form id="login-form">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Email hoặc Số điện thoại</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="username" placeholder="admin@techstore.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label for="password" class="form-label fw-semibold mb-0">Mật khẩu</label>
                                <a href="./forgot-password.html" class="small text-primary text-decoration-none">Quên mật khẩu?</a>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                                <button class="btn btn-outline-secondary" type="button" id="toggle-password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-3" id="btn-login">
                            <span class="spinner-border spinner-border-sm me-2 d-none" id="login-spinner"></span>
                            Đăng Nhập
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top">
                        <span class="text-muted">Chưa có tài khoản?</span>
                        <a href="./register.html" class="fw-semibold text-primary text-decoration-none ms-1">Đăng ký ngay</a>
                    </div>
                </div>

                <!-- Demo Credentials Info -->
                <div class="alert alert-info mt-4 rounded-3 p-3 small">
                    <strong><i class="bi bi-info-circle-fill me-1"></i> Tài khoản Demo (Mật khẩu: <code>password123</code>):</strong>
                    <ul class="mb-0 mt-1 ps-3">
                        <li><strong>Admin:</strong> <code>admin@techstore.com</code></li>
                        <li><strong>Staff:</strong> <code>staff@techstore.com</code></li>
                        <li><strong>Customer:</strong> <code>customer1@gmail.com</code></li>
                    </ul>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./login.js"></script>
</body>
</html>
